server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Applies to every location below that doesn't declare its own add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed bundles and assets never change once deployed.
    location ~ ^/(_expo|assets)/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app fallback so deep links such as /task/task-001 load the app.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
